<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/hormonas.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Calculadoras de nutrición clínica para endocrinólogos: suplementos orales, nutrición enteral y parenteral." />
    <meta name="theme-color" content="#28527a" />
    <title>EndocrineHub — Calculadoras de nutrición clínica</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Restore SPA path encoded by 404.html before React Router mounts.
      // The hash (Supabase auth tokens) is already correct — history.replaceState
      // only rewrites the pathname/search portion.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          });
          window.history.replaceState(
            null, null,
            l.pathname.slice(0, -1) + decoded[0] +
            (decoded.slice(1).length ? '?' + decoded.slice(1).join('&') : '') +
            l.hash
          );
        }
      }(window.location));
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
