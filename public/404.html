<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>EndocrineHub</title>
  <script>
    // SPA redirect for GitHub Pages — encodes the path as a query param so
    // index.html can restore it before React Router mounts.
    // The hash (Supabase auth tokens) is preserved as-is.
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.host +
      l.pathname.split('/').slice(0, 2).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
